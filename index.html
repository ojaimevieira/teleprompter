<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" name="viewport"/><meta content="#0b0b0c" name="theme-color"/><title>Teleprompter MixLabs</title><link href="styles.css" rel="stylesheet"/></head><body><div class="app"><aside class="panel" id="panel"><div class="head"><span class="logo"><b>T</b>Teleprompter</span><button class="close" id="close">×</button></div><div class="settings"><section><div class="label"><label for="editor">Roteiro</label><span id="stats">0 palavras</span></div><textarea id="editor" placeholder="Cole ou escreva seu roteiro…"></textarea><div class="actions"><button id="sample">Texto de teste</button><button class="danger" id="clear">Limpar</button></div></section><section><div class="label">Leitura</div><div class="row">Tamanho <span class="step"><button data-d="-4" data-k="font">−</button><output id="font">60</output><button data-d="4" data-k="font">+</button></span></div><div class="row">Entrelinha <span class="step"><button data-d="-.05" data-k="line">−</button><output id="line">1.45</output><button data-d=".05" data-k="line">+</button></span></div><div class="row">Margens <span class="step"><button data-d="-1" data-k="margin">−</button><output id="margin">12</output><button data-d="1" data-k="margin">+</button></span></div><div class="row">Linha-guia <span class="step"><button data-d="-5" data-k="cue">−</button><output id="cueOut">50</output><button data-d="5" data-k="cue">+</button></span></div><div class="row">Maiúsculas <label class="switch"><input id="upper" type="checkbox"/><i></i></label></div><div class="row">Espelhar horizontal <label class="switch"><input id="mirror" type="checkbox"/><i></i></label></div></section><section><div class="label">Histórico local</div><div class="history" id="history"></div></section><section class="help">Arraste o texto para navegar · Espaço: play · ↑/↓: velocidade · R: reiniciar · F: foco</section></div></aside><main class="stage"><button class="edit" id="edit">Editar</button><div class="scroll" id="scroll"><div class="page"><article class="reader" id="reader"></article></div></div><div class="cue"></div><nav class="hud"><button class="play" id="play">▶</button><button id="slow">−</button><span class="speed" id="speed">3</span><button id="fast">+</button><button id="restart">↺ <span class="word">Reiniciar</span></button><button id="focus">⛶ <span class="word">Tela cheia</span></button></nav><div class="progress" id="progress"></div></main></div><div class="count" id="count">3</div><script src="app.js"></script></body></html>
