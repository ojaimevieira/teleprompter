<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0b0c"><title>Teleprompter MixLabs</title><style>:root{color-scheme:dark;--a:#5e9fe8;--b:#151517;--c:#303036;--s:60px;--l:1.45;--m:12vw}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#000}body{font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f7f8;user-select:none;touch-action:none}button,textarea{font:inherit;color:inherit}button{min-width:44px;min-height:44px;border:1px solid var(--c);border-radius:9px;background:#202024;font-weight:650}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #5e9fe877;outline-offset:2px}.app{height:100dvh;display:grid;grid-template-columns:360px 1fr}.panel{z-index:5;min-height:0;background:var(--b);border-right:1px solid var(--c);display:flex;flex-direction:column}.head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;font-weight:750}.logo{display:flex;gap:10px;align-items:center}.logo b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--a);color:#07101a}.close{display:none}.settings{min-height:0;overflow:auto;padding:0 20px 80px;touch-action:pan-y;overscroll-behavior:contain}section{padding:17px 0;border-top:1px solid var(--c)}section:first-child{border:0;padding-top:4px}.label{display:flex;justify-content:space-between;margin-bottom:9px;color:#a4a4ad;font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}textarea{width:100%;min-height:210px;max-height:52vh;resize:vertical;padding:13px;border:1px solid var(--c);border-radius:9px;background:#101012;line-height:1.55;user-select:text;touch-action:manipulation}textarea:focus{min-height:min(42vh,380px);border-color:var(--a)}.actions{display:flex;justify-content:space-between;margin-top:9px}.danger{color:#ffaaa2}.row{display:grid;grid-template-columns:1fr auto;align-items:center;margin:11px 0;color:#d7d7dc;font-size:14px}.step{display:flex}.step button{border-radius:0}.step button:first-child{border-radius:8px 0 0 8px}.step button:last-child{border-radius:0 8px 8px 0}.step output{width:48px;height:44px;display:grid;place-items:center;border-block:1px solid var(--c);background:#111;font-size:13px}.switch{width:48px;height:28px;position:relative}.switch input{opacity:0}.switch i{position:absolute;inset:0;border-radius:18px;background:#29292e;border:1px solid var(--c)}.switch i:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#ddd;transition:.18s}.switch input:checked+i{background:var(--a)}.switch input:checked+i:after{transform:translateX(20px);background:#07101a}.help{color:#999;font-size:12px}.stage{position:relative;min-width:0;overflow:hidden}.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;touch-action:pan-y;overscroll-behavior:none}.scroll::-webkit-scrollbar{display:none}.page{min-height:100%;padding:38vh var(--m) calc(38vh + 90px)}.reader{max-width:1200px;margin:auto;font-size:var(--s);line-height:var(--l);font-weight:720;overflow-wrap:anywhere;transform-origin:center}.reader p{margin:0 0 .9em}.reader.up{text-transform:uppercase}.reader.mirror{transform:scaleX(-1)}.empty{color:#777}.cue{position:absolute;top:50%;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--a) 0 28px,transparent 28px calc(100% - 28px),var(--a) calc(100% - 28px));opacity:.4}.hud{position:absolute;z-index:3;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:7px;border:1px solid #ffffff26;border-radius:14px;background:#141417e8;backdrop-filter:blur(12px)}.hud button{background:transparent;border-color:transparent}.hud .play{background:var(--a);color:#07101a}.speed{width:28px;text-align:center;font-weight:700}.progress{position:absolute;bottom:0;width:0;height:3px;background:var(--a)}.edit{display:none}.count{position:fixed;z-index:20;inset:0;display:none;place-items:center;background:#000b;font-size:20vw;font-weight:800}.count.show{display:grid}.focus .panel,.focus .edit{display:none}.focus .app{grid-template-columns:1fr}.focus .hud{opacity:.2}.focus .hud:hover,.focus .hud:focus-within{opacity:1}@media(max-width:900px){:root{--s:44px;--m:7vw}.app{grid-template-columns:1fr}.panel{position:fixed;inset:0;transform:translateY(105%);transition:.22s}.panel.open{transform:none}.close,.edit{display:block}.edit{position:absolute;z-index:4;top:max(12px,env(safe-area-inset-top));left:12px}.settings{padding-inline:16px}.head{padding-inline:16px}textarea{min-height:34vh;max-height:55vh}textarea:focus{min-height:44vh}.hud{width:calc(100% - 24px);justify-content:center}.word{display:none}}@media(max-width:430px){:root{--s:38px}.hud button{padding-inline:9px}}</style></head><body><div class="app"><aside class="panel" id="panel"><div class="head"><span class="logo"><b>T</b>Teleprompter</span><button class="close" id="close">×</button></div><div class="settings"><section><div class="label"><label for="editor">Roteiro</label><span id="stats">0 palavras</span></div><textarea id="editor" placeholder="Cole ou escreva seu roteiro…"></textarea><div class="actions"><button id="sample">Texto de teste</button><button class="danger" id="clear">Limpar</button></div></section><section><div class="label">Leitura</div><div class="row">Tamanho <span class="step"><button data-k="font" data-d="-4">−</button><output id="font">60</output><button data-k="font" data-d="4">+</button></span></div><div class="row">Entrelinha <span class="step"><button data-k="line" data-d="-.05">−</button><output id="line">1.45</output><button data-k="line" data-d=".05">+</button></span></div><div class="row">Margens <span class="step"><button data-k="margin" data-d="-1">−</button><output id="margin">12</output><button data-k="margin" data-d="1">+</button></span></div><div class="row">Maiúsculas <label class="switch"><input id="upper" type="checkbox"><i></i></label></div><div class="row">Espelhar horizontal <label class="switch"><input id="mirror" type="checkbox"><i></i></label></div></section><section class="help">Espaço: play · ↑/↓: velocidade · R: reiniciar · F: foco</section></div></aside><main class="stage"><button class="edit" id="edit">Editar</button><div class="scroll" id="scroll"><div class="page"><article class="reader" id="reader"></article></div></div><div class="cue"></div><nav class="hud"><button class="play" id="play">▶</button><button id="slow">−</button><span class="speed" id="speed">3</span><button id="fast">+</button><button id="restart">↺ <span class="word">Reiniciar</span></button><button id="focus">⛶ <span class="word">Tela cheia</span></button></nav><div class="progress" id="progress"></div></main></div><div class="count" id="count">3</div><script>'use strict';const $=s=>document.querySelector(s),C=(n,a,b)=>Math.min(b,Math.max(a,n)),E=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),D={speed:3,font:60,line:1.45,margin:12,upper:false,mirror:false,text:''};let x={};try{x=JSON.parse(localStorage.getItem('tp2')||'{}')}catch{}const S={...D,...x,run:false,last:0,carry:0},ed=$('#editor'),rd=$('#reader'),sc=$('#scroll');function save(){localStorage.setItem('tp2',JSON.stringify({speed:S.speed,font:S.font,line:S.line,margin:S.margin,upper:S.upper,mirror:S.mirror,text:S.text}))}function render(){let t=S.text.trim(),w=t?t.split(/\s+/).length:0;rd.innerHTML=t?E(t).split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join(''):'<p class="empty">Seu roteiro aparece aqui.</p>';$('#stats').textContent=`${w} palavras${w?' · ~'+Math.max(1,Math.round(w/135))+' min':''}`;progress()}function prefs(){let r=document.documentElement.style;r.setProperty('--s',S.font+'px');r.setProperty('--l',S.line);r.setProperty('--m',S.margin+'vw');rd.classList.toggle('up',S.upper);rd.classList.toggle('mirror',S.mirror);$('#font').value=S.font;$('#line').value=S.line.toFixed(2);$('#margin').value=S.margin;$('#upper').checked=S.upper;$('#mirror').checked=S.mirror;$('#speed').textContent=S.speed}function progress(){let m=sc.scrollHeight-sc.clientHeight;$('#progress').style.width=(m?C(sc.scrollTop/m*100,0,100):0)+'%'}function run(v){S.run=!!v;$('#play').textContent=S.run?'Ⅱ':'▶';if(S.run&&'wakeLock'in navigator)navigator.wakeLock.request('screen').catch(()=>{})}function frame(t){let dt=Math.min(40,t-(S.last||t));S.last=t;if(S.run){S.carry+=[0,20,25,31,38,46,56,68,82,98,118][S.speed]*dt/1000;if(S.carry>=1){let n=Math.floor(S.carry);sc.scrollTop+=n;S.carry-=n;progress()}if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2)run(0)}requestAnimationFrame(frame)}function speed(d){S.speed=C(S.speed+d,1,10);prefs();save()}function restart(){run(0);sc.scrollTop=0;progress();let n=3,c=$('#count');c.textContent=n;c.classList.add('show');let i=setInterval(()=>{if(--n)c.textContent=n;else{clearInterval(i);c.textContent='●';setTimeout(()=>{c.classList.remove('show');run(1)},300)}},650)}async function focus(){if(document.body.classList.contains('focus')||document.fullscreenElement){if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});document.body.classList.remove('focus')}else{document.body.classList.add('focus');$('#panel').classList.remove('open');if(document.fullscreenEnabled)await document.documentElement.requestFullscreen().catch(()=>{})}}ed.value=S.text;ed.oninput=()=>{S.text=ed.value;render();save()};ed.onfocus=()=>run(0);$('#sample').onclick=()=>{if(S.text&& !confirm('Substituir o roteiro atual?'))return;S.text='Bem-vindo ao Teleprompter.\n\nAjuste o texto, a velocidade e as margens antes de gravar.';ed.value=S.text;render();save();ed.focus()};$('#clear').onclick=()=>{if(S.text&&!confirm('Limpar o roteiro?'))return;S.text=ed.value='';render();save()};document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k,d=+b.dataset.d;if(k==='font')S.font=C(S.font+d,24,96);if(k==='line')S.line=C(Math.round((S.line+d)*100)/100,1.1,2.2);if(k==='margin')S.margin=C(S.margin+d,2,24);prefs();save()});['upper','mirror'].forEach(k=>$('#'+k).onchange=e=>{S[k]=e.target.checked;prefs();save()});$('#play').onclick=()=>run(!S.run);$('#slow').onclick=()=>speed(-1);$('#fast').onclick=()=>speed(1);$('#restart').onclick=restart;$('#focus').onclick=focus;$('#edit').onclick=()=>{run(0);$('#panel').classList.add('open');setTimeout(()=>ed.focus(),230)};$('#close').onclick=()=>$('#panel').classList.remove('open');sc.onscroll=progress;sc.onpointerdown=()=>run(0);document.addEventListener('touchmove',e=>{if(!e.target.closest('.scroll,.settings,textarea'))e.preventDefault()},{passive:false});['gesturestart','gesturechange'].forEach(k=>document.addEventListener(k,e=>e.preventDefault(),{passive:false}));document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('focus',!!document.fullscreenElement));document.onkeydown=e=>{if(e.target===ed)return;if([' ','ArrowUp','ArrowDown','r','R','f','F'].includes(e.key))e.preventDefault();if(e.key===' ')run(!S.run);if(e.key==='ArrowUp')speed(1);if(e.key==='ArrowDown')speed(-1);if(/r/i.test(e.key))restart();if(/f/i.test(e.key))focus()};prefs();render();requestAnimationFrame(frame)</script></body></html>
